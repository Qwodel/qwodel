name: Publish Qwodel Package

# 1. The Trigger Logic
on:
  push:
    tags:
      - 'v*' # Wakes up ONLY when a tag like v1.0.0, v2.1.0, etc., is pushed
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and Upload to PyPI
    runs-on: ubuntu-latest
    
    steps:
      # 2. Grab the exact code snapshot for this tag
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. Setup the Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Adjust to your target version

      # 4. Install standard build tools
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      # 5. Build the .tar.gz and .whl files
      - name: Build package
        run: python -m build

      # 6. Upload to PyPI using the official GitHub Action
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
