[build-system]
requires = ["setuptools>=65", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "qwodel"
dynamic = ["version"]
description = "Production-grade model quantization for AWQ, GGUF, and CoreML"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Qwodel Contributors"}
]
maintainers = [
    {name = "Qwodel Contributors"}
]
keywords = [
    "quantization",
    "model-compression",
    "llm",
    "awq",
    "gguf",
    "coreml",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

# Minimal base dependencies - NO PyTorch, NO heavy ML libs
dependencies = [
    "transformers>=4.36.0,<6.0",
    "huggingface_hub>=0.20.0,<1.0",
    "safetensors>=0.4.0,<1.0",
    "numpy>=1.24.0,<2.0",
    "pydantic>=2.0.0,<3.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "typing-extensions>=4.0.0; python_version < '3.10'",
]

[project.optional-dependencies]
# AWQ backend - GPU quantization (install PyTorch with CUDA separately)
awq = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "torchaudio==2.1.2",
    "llmcompressor>=0.2.0",
    "accelerate>=0.25.0",
    "optimum>=1.16.0",
    "datasets>=2.14.0",
]

# GGUF backend - CPU quantization (compatible with same PyTorch version)
gguf = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "torchaudio==2.1.2",
    "gguf>=0.10.0",
    "tiktoken>=0.5.0",
    "sentencepiece>=0.1.99",
]

# CoreML backend - Apple devices (compatible with same PyTorch version)
coreml = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "torchaudio==2.1.2",
    "coremltools>=7.0.0",
]

# All backends - now works without conflicts!
all = ["qwodel[awq,gguf,coreml]"]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

# Documentation dependencies
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/YOUR_ORG/qwodel"
Documentation = "https://qwodel.readthedocs.io"
Repository = "https://github.com/YOUR_ORG/qwodel"
Issues = "https://github.com/YOUR_ORG/qwodel/issues"
Changelog = "https://github.com/YOUR_ORG/qwodel/blob/main/CHANGELOG.md"

[project.scripts]
qwodel = "qwodel.cli.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["qwodel*"]
namespaces = false

[tool.setuptools.package-data]
qwodel = ["py.typed"]

[tool.setuptools_scm]
write_to = "src/qwodel/__version__.py"
version_scheme = "post-release"

# Ruff - Modern linter and formatter
[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*.py" = ["S101"]  # Allow assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Mypy - Static type checking
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "huggingface_hub.*",
    "gguf.*",
    "coremltools.*",
    "llmcompressor.*",
]
ignore_missing_imports = true

# Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=qwodel",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "integration: marks tests as integration tests",
]

# Coverage
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "**/__init__.py",
    "**/cli/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
